
name: Extract and Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract ZIP
        run: |
          ZIP=$(find . -maxdepth 3 -type f -name "*.zip" | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "No ZIP found"
            exit 1
          fi
          mkdir -p extracted
          unzip -oq "$ZIP" -d extracted

      - name: Locate Android project
        run: |
          ROOT=$(find extracted \( -name settings.gradle.kts -o -name settings.gradle \) | head -n 1)
          if [ -z "$ROOT" ]; then
            echo "Android project not found"
            exit 1
          fi
          cp -a "$(dirname "$ROOT")"/. .

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: app/build/outputs/apk/debug/*.apk
